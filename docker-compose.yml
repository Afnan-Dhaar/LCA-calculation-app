services:
  postgres:
    image: postgres:16-alpine
    container_name: lca_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: pcf_lca
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pcf_lca"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lca_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@postgres:5432/pcf_lca
      API_SECURITY_ENABLED: "false"
      API_KEY: "lca-studio-secret-2026"
      RATE_LIMIT_PER_MINUTE: "120"
      RATE_LIMIT_ENABLED: "true"
      MAX_PAYLOAD_BYTES: "10485760"
      BW_PROJECT: "pcf_lca_api"
    ports:
      - "8000:8000"
    volumes:
      - bw_data:/app/brightway_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lca_frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  pg_data:
  bw_data:
